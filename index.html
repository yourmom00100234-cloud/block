<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Block Puzzle</title>
    <!-- 구글 애드센스 스크립트 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2157167042014574" crossorigin="anonymous"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 800px;
            background: #12131c;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }
        .score-box {
            display: flex;
            flex-direction: column;
        }
        .score-title {
            font-size: 12px;
            color: #888;
        }
        .score-val {
            font-size: 24px;
            font-weight: bold;
            color: #00f3ff;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        /* Puzzle Grid Board (8x8) */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 340px;
            height: 340px;
            background: #1a1c29;
            padding: 8px;
            border-radius: 12px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .cell {
            background: #252839;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .cell.filled {
            background: #00f3ff;
            box-shadow: 0 0 8px #00f3ff;
        }
        .cell.highlight {
            background: rgba(0, 243, 255, 0.4);
        }
        /* Dock for 3 spawnable blocks */
        #dock {
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #171924;
            border-radius: 12px;
            padding: 10px;
        }
        .dock-slot {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .mini-grid {
            display: grid;
            gap: 2px;
        }
        .mini-cell {
            width: 18px;
            height: 18px;
            background: #252839;
            border-radius: 3px;
        }
        .mini-cell.filled {
            background: #ff0055;
            box-shadow: 0 0 6px #ff0055;
        }

        /* Screen overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 12, 16, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s;
        }
        .hidden {
            display: none !important;
        }
        h1 {
            font-size: 38px;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff;
            margin-bottom: 10px;
            text-align: center;
        }
        p.subtitle {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 15px;
        }
        .btn {
            background: linear-gradient(45deg, #00f3ff, #ff0055);
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <div class="score-box">
            <span class="score-title">SCORE</span>
            <span class="score-val" id="scoreDisplay">0</span>
        </div>
        <div class="score-box" style="align-items: flex-end;">
            <span class="score-title">HIGH SCORE</span>
            <span class="score-val" id="highScoreDisplay" style="color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5);">0</span>
        </div>
    </div>

    <!-- 8x8 Board -->
    <div id="board"></div>

    <!-- Bottom Dock -->
    <div id="dock">
        <div class="dock-slot" id="slot0"></div>
        <div class="dock-slot" id="slot1"></div>
        <div class="dock-slot" id="slot2"></div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="screen">
        <h1>NEON BLOCK<br>PUZZLE</h1>
        <p class="subtitle">블록을 채워 가로·세로 줄을 터뜨리세요!</p>
        <button class="btn" id="startBtn">게임 시작</button>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="screen hidden">
        <h1 style="color: #ff0055; text-shadow: 0 0 15px #ff0055;">GAME OVER</h1>
        <p class="subtitle" id="finalScoreText">최종 점수: 0점</p>
        <button class="btn" id="restartBtn">다시 하기</button>
    </div>
</div>

<script>
// --- Audio Controller ---
class SoundController {
    constructor() { this.ctx = null; }
    init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    pop() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
    }
    clear() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.setValueAtTime(900, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
    }
}
const audio = new SoundController();

// --- Game Logic ---
const BOARD_SIZE = 8;
let board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
let score = 0;
let highScore = localStorage.getItem('block_puzzle_highscore') || 0;
document.getElementById('highScoreDisplay').innerText = highScore;

let currentBlocks = [null, null, null];

// Shape templates
const SHAPES = [
    [[1]], // 1x1
    [[1, 1]], // 2x1
    [[1], [1]], // 1x2
    [[1, 1], [1, 1]], // 2x2 Square
    [[1, 1, 1]], // 3x1
    [[1], [1], [1]], // 1x3
    [[1, 1], [1, 0]], // L-shape small
    [[1, 1, 1], [0, 0, 1]], // L-shape
    [[1, 1], [0, 1]] // Z-shape
];

const boardEl = document.getElementById('board');
const cells = [];

// Initialize Board DOM
for (let r = 0; r < BOARD_SIZE; r++) {
    cells[r] = [];
    for (let c = 0; c < BOARD_SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r;
        cell.dataset.c = c;
        boardEl.appendChild(cell);
        cells[r][c] = cell;
    }
}

function renderBoard() {
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            if (board[r][c] === 1) {
                cells[r][c].classList.add('filled');
            } else {
                cells[r][c].classList.remove('filled');
            }
        }
    }
}

function getRandomShape() {
    return SHAPES[Math.floor(Math.random() * SHAPES.length)];
}

function generateNewBlocks() {
    for (let i = 0; i < 3; i++) {
        currentBlocks[i] = getRandomShape();
    }
    renderDock();
    checkGameOver();
}

function renderDock() {
    for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`slot${i}`);
        slot.innerHTML = '';
        if (!currentBlocks[i]) continue;

        const shape = currentBlocks[i];
        const rows = shape.length;
        const cols = shape[0].length;

        const miniGrid = document.createElement('div');
        miniGrid.className = 'mini-grid';
        miniGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const mc = document.createElement('div');
                mc.className = 'mini-cell';
                if (shape[r][c] === 1) mc.classList.add('filled');
                miniGrid.appendChild(mc);
            }
        }
        slot.appendChild(miniGrid);

        // Make draggable/clickable
        slot.onmousedown = (e) => startDrag(i, e);
        slot.ontouchstart = (e) => startDrag(i, e.touches[0]);
    }
}

// Drag & Drop / Tap Simulation Logic
let draggingIndex = null;
let dragElement = null;

function startDrag(index, e) {
    audio.init();
    if (!currentBlocks[index]) return;
    draggingIndex = index;

    // Create floating element following touch/mouse
    dragElement = document.createElement('div');
    dragElement.style.position = 'fixed';
    dragElement.style.zIndex = 1000;
    dragElement.style.pointerEvents = 'none';
    dragElement.style.transform = 'translate(-50%, -100%) scale(1.2)';
    
    const shape = currentBlocks[index];
    const rows = shape.length;
    const cols = shape[0].length;
    
    const miniGrid = document.createElement('div');
    miniGrid.className = 'mini-grid';
    miniGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const mc = document.createElement('div');
            mc.className = 'mini-cell';
            if (shape[r][c] === 1) mc.classList.add('filled');
            miniGrid.appendChild(mc);
        }
    }
    dragElement.appendChild(miniGrid);
    document.body.appendChild(dragElement);

    moveDrag(e.clientX, e.clientY);

    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('touchmove', onTouchMove);
    window.addEventListener('touchend', onTouchEnd);
}

function onMouseMove(e) { moveDrag(e.clientX, e.clientY); highlightTarget(e.clientX, e.clientY); }
function onTouchMove(e) { moveDrag(e.touches[0].clientX, e.touches[0].clientY); highlightTarget(e.touches[0].clientX, e.touches[0].clientY); }

function moveDrag(x, y) {
    if (dragElement) {
        dragElement.style.left = `${x}px`;
        dragElement.style.top = `${y}px`;
    }
}

function highlightTarget(x, y) {
    // Clear highlights
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            cells[r][c].classList.remove('highlight');
        }
    }

    const targetCell = document.elementFromPoint(x, y)?.closest('.cell');
    if (!targetCell) return;

    const startR = parseInt(targetCell.dataset.r);
    const startC = parseInt(targetCell.dataset.c);
    const shape = currentBlocks[draggingIndex];

    if (canPlace(shape, startR, startC)) {
        for (let r = 0; r < shape.length; r++) {
            for (let c = 0; c < shape[0].length; c++) {
                if (shape[r][c] === 1) {
                    cells[startR + r][startC + c].classList.add('highlight');
                }
            }
        }
    }
}

function onMouseUp(e) { finishDrag(e.clientX, e.clientY); cleanupDrag(); }
function onTouchEnd(e) { finishDrag(e.changedTouches[0].clientX, e.changedTouches[0].clientY); cleanupDrag(); }

function cleanupDrag() {
    if (dragElement) dragElement.remove();
    dragElement = null;
    draggingIndex = null;
    for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
            cells[r][c].classList.remove('highlight');
        }
    }
    window.removeEventListener('mousemove', onMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    window.removeEventListener('touchmove', onTouchMove);
    window.removeEventListener('touchend', onTouchEnd);
}

function finishDrag(x, y) {
    const targetCell = document.elementFromPoint(x, y)?.closest('.cell');
    if (!targetCell) return;

    const startR = parseInt(targetCell.dataset.r);
    const startC = parseInt(targetCell.dataset.c);
    const shape = currentBlocks[draggingIndex];

    if (canPlace(shape, startR, startC)) {
        placeBlock(shape, startR, startC);
        currentBlocks[draggingIndex] = null;
        audio.pop();
        renderDock();

        // Check if all 3 blocks used, generate new ones
        if (currentBlocks.every(b => b === null)) {
            generateNewBlocks();
        } else {
            checkGameOver();
        }
    }
}

function canPlace(shape, startR, startC) {
    const rows = shape.length;
    const cols = shape[0].length;
    if (startR + rows > BOARD_SIZE || startC + cols > BOARD_SIZE) return false;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (shape[r][c] === 1 && board[startR + r][startC + c] === 1) {
                return false;
            }
        }
    }
    return true;
}

function placeBlock(shape, startR, startC) {
    const rows = shape.length;
    const cols = shape[0].length;
    let placedCount = 0;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (shape[r][c] === 1) {
                board[startR + r][startC + c] = 1;
                placedCount++;
            }
        }
    }
    score += placedCount * 10;
    checkLines();
    updateScore();
    renderBoard();
}

function checkLines() {
    let rowsToClear = [];
    let colsToClear = [];

    // Check rows
    for (let r = 0; r < BOARD_SIZE; r++) {
        if (board[r].every(cell => cell === 1)) rowsToClear.push(r);
    }
    // Check cols
    for (let c = 0; c < BOARD_SIZE; c++) {
        let full = true;
        for (let r = 0; r < BOARD_SIZE; r++) {
            if (board[r][c] === 0) full = false;
        }
        if (full) colsToClear.push(c);
    }

    if (rowsToClear.length > 0 || colsToClear.length > 0) {
        audio.clear();
        rowsToClear.forEach(r => {
            for (let c = 0; c < BOARD_SIZE; c++) board[r][c] = 0;
        });
        colsToClear.forEach(c => {
            for (let r = 0; r < BOARD_SIZE; r++) board[r][c] = 0;
        });

        const clearedLines = rowsToClear.length + colsToClear.length;
        score += clearedLines * 100 * clearedLines; // Bonus for multi-lines
        updateScore();
    }
}

function updateScore() {
    document.getElementById('scoreDisplay').innerText = score;
    if (score > highScore) {
        highScore = score;
        localStorage.setItem('block_puzzle_highscore', highScore);
        document.getElementById('highScoreDisplay').innerText = highScore;
    }
}

function checkGameOver() {
    // Check if any remaining block can be placed anywhere on the board
    let possible = false;
    for (let i = 0; i < 3; i++) {
        if (currentBlocks[i] === null) continue;
        const shape = currentBlocks[i];
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                if (canPlace(shape, r, c)) possible = true;
            }
        }
    }

    if (!possible && currentBlocks.some(b => b !== null)) {
        setTimeout(gameOver, 300);
    }
}

function gameOver() {
    document.getElementById('finalScoreText').innerText = `최종 점수: ${score}점`;
    document.getElementById('gameOverScreen').classList.remove('hidden');
}

function resetGame() {
    board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(0));
    score = 0;
    updateScore();
    renderBoard();
    generateNewBlocks();
}

// UI Handlers
document.getElementById('startBtn').addEventListener('click', () => {
    audio.init();
    resetGame();
    document.getElementById('startScreen').classList.add('hidden');
});

document.getElementById('restartBtn').addEventListener('click', () => {
    audio.init();
    resetGame();
    document.getElementById('gameOverScreen').classList.add('hidden');
});
</script>
</body>
</html>
